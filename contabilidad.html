<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contabilidad Muebles Ideal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Karla:wght@400;500;600;700&display=swap">
<style>
/* Mismo lenguaje del panel: neutro y denso; dorado = acción, verde = entra dinero, rojo = sale */
:root { --bg:#eeede9; --surface:#ffffff; --ink:#141414; --muted:#6a655d; --line:#dcd8cf; --gold:#b8913f; --gold-ink:#141414; --soft:#f6f1e6;
  --ok:#2e7d32; --ok-bg:#e8f3e9; --bad:#b3261e; --bad-bg:#fbeae8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --display:"Lexend","Segoe UI",system-ui,sans-serif; --body:"Karla","Helvetica Neue",Arial,sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid transparent; font-family: var(--display); font-weight: 500; font-size: .9rem; cursor: pointer; background: var(--ink); color: #fff; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.btn.oro { background: var(--gold); color: var(--gold-ink); }
.btn.borde { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.peligro { background: var(--bad); }
.btn.mini { padding: 6px 12px; font-size: .8rem; }
.btn[disabled] { opacity: .55; cursor: progress; }
input[type=text], input[type=number], input[type=email], input[type=password], input[type=tel], input[type=date], input[type=month], select, textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; min-height: 42px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
textarea { min-height: 120px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 700; min-width: 0; }
label.f small { font-weight: 400; color: var(--muted); }
.chk { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--gold); }
.ayuda { font-size: .86rem; color: var(--muted); margin: 0; }
.link { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 700; text-decoration: underline; cursor: pointer; }

/* Acceso */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(180deg, #5b5a56, #1c1b19 70%); }
.login form, .login .caja-msg { width: min(400px, 100%); background: var(--surface); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 14px; }
.login img { height: 64px; width: auto; align-self: center; }
.login h1 { text-align: center; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .06em; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: .9rem; margin: 0; }
.msg.err { background: var(--bad-bg); color: var(--bad); } .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.warn { background: var(--warn-bg); color: var(--warn); }

/* Estructura */
.top { position: sticky; top: 0; z-index: 20; background: var(--ink); color: #fff; padding: 10px max(16px, 3vw); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top img { height: 34px; width: auto; filter: invert(1); }
.top h1 { font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; }
.top .yo { margin-left: auto; font-size: .82rem; opacity: .75; }
.top .btn.borde { color: #fff; border-color: rgba(255,255,255,.35); }
.tasa-top { font-size: .8rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 max(16px, 3vw); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 54px; z-index: 19; }
.tab { padding: 14px 16px; border: 0; background: none; font-family: var(--display); font-size: .9rem; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .72rem; line-height: 20px; }
main { padding: 22px max(16px, 3vw) 60px; max-width: 1300px; margin: 0 auto; }
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.barra h2 { font-size: 1.25rem; margin-right: auto; }
.barra input, .barra select { width: auto; min-width: 150px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.vacio { padding: 30px; text-align: center; color: var(--muted); }
.sec-t { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; margin: 26px 0 12px; font-family: var(--display); }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi span { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.kpi b { font-family: var(--display); font-weight: 500; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: .82rem; }
.kpi.verde b { color: var(--ok); } .kpi.rojo b { color: var(--bad); }
.kpi.destacado { background: var(--ink); color: #fff; border-color: var(--ink); } .kpi.destacado span, .kpi.destacado small { color: #cfc8b8; }
.alerta { margin-top: 12px; }
.dos { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.panel { padding: 18px; }
.panel h3 { font-size: .95rem; margin-bottom: 12px; }
.leyenda { display: flex; gap: 16px; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg.graf { width: 100%; height: auto; display: block; }
.hbar { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: .85rem; margin-bottom: 8px; }
.hbar .b { height: 12px; border-radius: 6px; background: var(--ink); min-width: 2px; }
.hbar .v { font-variant-numeric: tabular-nums; font-weight: 700; }
.cajas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.caja { padding: 14px 16px; }
.caja b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.2rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.caja small { color: var(--muted); }
.caja .neg { color: var(--bad); }

/* Tablas */
.wrap-t { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.clic { cursor: pointer; } table.t tr.clic:hover td { background: var(--soft); }
table.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
.mas { color: var(--ok); } .menos { color: var(--bad); }
.sub { display: block; color: var(--muted); font-size: .8rem; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.chip.ingreso, .chip.aporte { background: var(--ok-bg); color: var(--ok); }
.chip.gasto { background: var(--bad-bg); color: var(--bad); }
.chip.sueldo { background: #ece6f6; color: #5a3d8a; }
.chip.retiro { background: var(--warn-bg); color: var(--warn); }
.chip.transferencia { background: #e7eef6; color: #2c5282; }
.chip.est-entregado { background: var(--ok-bg); color: var(--ok); } .chip.est-anulado { background: #eee; color: #888; }
.chip.est-en-fabricacion { background: var(--warn-bg); color: var(--warn); } .chip.est-listo-para-entregar { background: #e7eef6; color: #2c5282; }

/* Formularios y hoja lateral */
.hoja { position: fixed; inset: 0; z-index: 40; background: rgba(15,14,13,.55); display: flex; justify-content: flex-end; }
.hoja > div { width: min(760px, 100%); height: 100%; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; }
.hoja header { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.hoja header h2 { font-size: 1.1rem; margin-right: auto; }
.form { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.bloque { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.bloque > h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; }
.fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-family: var(--display); font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.equiv { font-family: var(--display); font-size: .95rem; margin: -4px 0 0; color: var(--muted); }
.equiv b { color: var(--ink); font-weight: 500; }
.confirma { background: var(--bad-bg); border: 1px solid #f0c4bf; border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.resumen-v { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.resumen-v div { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.resumen-v span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.resumen-v b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.lista-cot { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.lista-cot button { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
.lista-cot button:hover { border-color: var(--gold); }
.anotar { max-width: 640px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .9rem; max-width: calc(100% - 32px); }
@media (max-width: 860px) { .dos { grid-template-columns: 1fr; } .resumen-v { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .top .yo { display: none; } .tasa-top { margin-left: auto; }
  .barra input, .barra select { min-width: 0; flex: 1 1 140px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi { padding: 12px 14px; } .kpi.destacado, .kpi.ancho { grid-column: 1 / -1; }
  .kpi b { font-size: 1.2rem; } .kpi span { font-size: .7rem; }
  .barra h2 { flex-basis: 100%; }
  table.t th, table.t td { padding: 9px 8px; }
  .ocultar-movil { display: none; }
}
</style>
</head>
<body>

<!-- ===== ACCESO ===== -->
<section class="login" id="v-login">
  <form id="f-login" novalidate>
    <img src="logo-v.png" alt="Muebles Ideal">
    <h1>Contabilidad</h1>
    <label class="f">Correo<input type="email" id="l-email" autocomplete="username"></label>
    <label class="f">Contraseña<input type="password" id="l-pass" autocomplete="current-password"></label>
    <button class="btn oro" type="submit" id="l-btn">ENTRAR</button>
    <p class="msg" id="l-msg" hidden></p>
    <p class="ayuda" style="text-align:center">¿Primera vez u olvidaste tu contraseña? <button type="button" class="link" id="l-reset">Enviarme un enlace</button></p>
  </form>
</section>

<section class="login" id="v-sin" hidden>
  <div class="caja-msg">
    <img src="logo-v.png" alt="Muebles Ideal">
    <h1>Sin acceso</h1>
    <p class="msg warn" id="sin-msg"></p>
    <button class="btn" type="button" id="sin-salir">SALIR</button>
  </div>
</section>

<!-- ===== PANEL ===== -->
<section id="v-panel" hidden>
  <div class="top">
    <img src="logo-mark.png" alt="">
    <h1>Contabilidad</h1>
    <span class="yo" id="yo"></span>
    <span class="tasa-top" id="tasa-top"></span>
    <a class="btn borde mini solo-dueno" href="admin.html">Catálogo</a>
    <button class="btn borde mini" id="salir" type="button">Salir</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main>
    <section id="t-resumen" hidden></section>
    <section id="t-movimientos" hidden></section>
    <section id="t-ventas" hidden></section>
    <section id="t-cobrar" hidden></section>
    <section id="t-ajustes" hidden></section>
    <section id="t-anotar" hidden></section>
    <section id="t-mios" hidden></section>
  </main>
</section>

<div class="hoja" id="editor" hidden><div id="editor-in"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBJXjU2TUQvCa7xxe1bEa8WchLrn8LDsyM",
  authDomain: "muebles-ideal-38af6.firebaseapp.com",
  projectId: "muebles-ideal-38af6",
  storageBucket: "muebles-ideal-38af6.firebasestorage.app",
  messagingSenderId: "971429499996",
  appId: "1:971429499996:web:ba6aabf7e61514e0e8c299"
};
const DUENO = "mueblesideal2020@gmail.com";
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toast = t => { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3000); };
const slug = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "item";
const nuevoId = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* ===== Números y fechas (formato venezolano: 1.234,56) ===== */
const num = s => { s = String(s == null ? "" : s).trim().replace(/[^\d.,-]/g, ""); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); else if ((s.match(/\./g) || []).length > 1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, ""); /* 1.200 = mil doscientos */ const n = parseFloat(s); return isFinite(n) ? n : 0; };
const fmtN = n => (Math.round((n || 0) * 100) / 100).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtU = n => (n < 0 ? "-$" : "$") + fmtN(Math.abs(n || 0));
const fmtM = (n, mon) => mon === "VES" ? "Bs " + fmtN(n) : fmtU(n);
const inNum = n => n ? String(Math.round(n * 100) / 100).replace(".", ",") : "";
const hoy = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const nombreMes = m => MESES[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const mesCorto = m => MESES[+m.slice(5, 7) - 1].slice(0, 3);
const fechaCorta = f => f ? f.slice(8, 10) + "/" + f.slice(5, 7) + "/" + f.slice(2, 4) : "";
const mesMas = (m, k) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const diasDesde = f => Math.max(0, Math.round((new Date(hoy()) - new Date(f)) / 864e5));

/* ===== Catálogos de la contabilidad ===== */
const TIPOS = {
  ingreso:       { n: "Ingreso",           s: +1, ayuda: "Dinero que entra por ventas u otros cobros." },
  gasto:         { n: "Gasto",             s: -1, ayuda: "Compras de material, pagos al taller, flete, servicios… todo lo que el negocio paga." },
  transferencia: { n: "Mover entre cajas", s:  0, ayuda: "Pasar dinero de una caja a otra, por ejemplo cambiar bolívares a dólares. No es ingreso ni gasto." },
  sueldo:        { n: "Sueldo del dueño",  s: -1, ayuda: "Tu pago fijo. Es la forma ordenada de llevar dinero del negocio a lo personal." },
  retiro:        { n: "Retiro personal",   s: -1, ayuda: "Dinero del negocio usado para algo personal fuera del sueldo. Anótalo siempre, aunque sea poco." },
  aporte:        { n: "Aporte del dueño",  s: +1, ayuda: "Dinero tuyo (personal) que metes al negocio." }
};
const ESTADOS = ["Por fabricar", "En fabricación", "Listo para entregar", "Entregado", "Anulado"];
const CAT_ING = ["Venta de muebles", "Venta de accesorios", "Reparaciones y tapizado", "Otros ingresos"];
const CAT_GAS = ["Telas", "Madera y MDF", "Goma espuma y guata", "Herrajes, patas y rieles", "Grapas, pegamento y tornillos", "Accesorios (USB, portavasos…)", "Mano de obra / taller", "Flete y delivery", "Alquiler del local", "Servicios (luz, agua, internet)", "Publicidad y redes", "Herramientas y equipos", "Comisiones bancarias", "Impuestos y trámites", "Otros gastos"];
const CAJAS_SUGERIDAS = [
  { nombre: "Banco (Pago Móvil y transferencias)", moneda: "VES" }, { nombre: "Efectivo en dólares", moneda: "USD" },
  { nombre: "Efectivo en bolívares", moneda: "VES" }, { nombre: "Binance (USDT)", moneda: "USD" }
];

/* ===== Estado ===== */
let ROL = null, YO = "", CUENTAS = [], MOVS = [], VENTAS = [], EQUIPO = [];
let AJ = { categoriasIngreso: CAT_ING, categoriasGasto: CAT_GAS, tasa: { valor: 0, fecha: "" } };
let PRIV = { sueldo: { monto: 0, frecuencia: "mensual", cuenta: "" } };
let tab = "resumen", MES = hoy().slice(0, 7);
const filtro = { mes: MES, tipo: "", cuenta: "", q: "", estado: "activas", qv: "" };

/* ===== Acceso ===== */
const msgLogin = (t, tipo) => { const m = $("l-msg"); m.textContent = t; m.className = "msg " + tipo; m.hidden = false; };
$("f-login").addEventListener("submit", async e => {
  e.preventDefault(); const b = $("l-btn"); b.disabled = true; b.textContent = "Entrando…";
  try { await auth.signInWithEmailAndPassword($("l-email").value.trim().toLowerCase(), $("l-pass").value); }
  catch (err) { msgLogin(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(err.code || "") ? "Correo o contraseña incorrectos." : /too-many/.test(err.code || "") ? "Demasiados intentos. Espera unos minutos." : "No se pudo entrar: " + (err.message || err), "err"); }
  finally { b.disabled = false; b.textContent = "ENTRAR"; }
});
$("l-reset").addEventListener("click", async () => {
  const em = $("l-email").value.trim().toLowerCase(); if (!em) return msgLogin("Escribe tu correo primero.", "err");
  try { await auth.sendPasswordResetEmail(em); msgLogin("Te enviamos un enlace a " + em + " para crear tu contraseña.", "ok"); }
  catch (err) { msgLogin("No se pudo enviar el enlace: " + (err.message || err), "err"); }
});
$("salir").addEventListener("click", () => auth.signOut());
$("sin-salir").addEventListener("click", () => auth.signOut());
try { const u = localStorage.getItem("mi-contab-email"); $("l-email").value = u || DUENO; } catch (e) { $("l-email").value = DUENO; }

auth.onAuthStateChanged(async u => {
  ["v-login", "v-sin", "v-panel"].forEach(k => $(k).hidden = true);
  if (!u) { ROL = null; $("v-login").hidden = false; return; }
  YO = (u.email || "").toLowerCase();
  try { localStorage.setItem("mi-contab-email", YO); } catch (e) {}
  if (YO === DUENO) ROL = "dueno";
  else {
    try { const d = await db.collection("equipo").doc(YO).get(); ROL = d.exists && d.data().activo !== false ? "ayudante" : null; }

/* ===== Datos ===== */
const lista = s => s.docs.map(d => Object.assign({ id: d.id }, d.data()));
async function cargar(){
  try {
    const comun = [db.collection("cuentas").get(), db.collection("ventas").get(), db.collection("contab").doc("publico").get()];
    if (ROL === "dueno") {
      const [cu, ve, pu, mo, pr, eq] = await Promise.all([...comun, db.collection("movimientos").get(), db.collection("contab").doc("privado").get(), db.collection("equipo").get()]);
      CUENTAS = lista(cu); VENTAS = lista(ve); MOVS = lista(mo); EQUIPO = lista(eq);
      if (pu.exists) AJ = Object.assign(AJ, pu.data());
      if (pr.exists) PRIV = Object.assign(PRIV, pr.data());
    } else {
      const [cu, ve, pu, mo] = await Promise.all([...comun, db.collection("movimientos").where("creadoPor", "==", YO).get()]);
      CUENTAS = lista(cu); VENTAS = lista(ve); MOVS = lista(mo);
      if (pu.exists) AJ = Object.assign(AJ, pu.data());
    }
    CUENTAS.sort((a, b) => (a.orden || 0) - (b.orden || 0));
    pintarTabs(); pintar();
  } catch (err) { console.error(err); toast("No se pudo leer la base de datos. Revisa que publicaste las reglas nuevas de Firestore."); }
}
const movsOrdenados = arr => arr.slice().sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || String(b.id).localeCompare(String(a.id)));
const cuenta = id => CUENTAS.find(c => c.id === id);
const nomCuenta = id => (cuenta(id) || { nombre: "(caja eliminada)" }).nombre;
const venta = id => VENTAS.find(v => v.id === id);

/* Saldos y cálculos */
function saldo(c){
  let s = num(c.inicial);
  for (const m of MOVS) {
    if (m.cuenta === c.id) s += (m.tipo === "ingreso" || m.tipo === "aporte" ? 1 : -1) * (m.monto || 0);
    if (m.tipo === "transferencia" && m.cuentaDestino === c.id) s += m.montoDestino || 0;
  }
  return s;
}
const aUSD = (monto, mon) => mon === "VES" ? (AJ.tasa && AJ.tasa.valor ? monto / AJ.tasa.valor : 0) : monto;
const cobrado = v => MOVS.filter(m => m.ventaId === v.id && m.tipo === "ingreso").reduce((a, m) => a + (m.usd || 0), 0);
const costo = v => MOVS.filter(m => m.ventaId === v.id && m.tipo === "gasto").reduce((a, m) => a + (m.usd || 0), 0);
const saldoVenta = v => v.estado === "Anulado" ? 0 : Math.max(0, num(v.total) - cobrado(v));
function totalesMes(m){
  const t = { ingreso: 0, gasto: 0, sueldo: 0, retiro: 0, aporte: 0, cat: {} };
  for (const x of MOVS) if ((x.fecha || "").startsWith(m) && x.tipo in t) {
    t[x.tipo] += x.usd || 0;
    if (x.tipo === "gasto") t.cat[x.categoria || "Otros gastos"] = (t.cat[x.categoria || "Otros gastos"] || 0) + (x.usd || 0);
  }
  t.utilidad = t.ingreso - t.gasto; t.queda = t.utilidad - t.sueldo - t.retiro;
  return t;
}
const VECES = { mensual: 1, quincenal: 2, semanal: 4 };
const sueldoEsperado = () => num(PRIV.sueldo.monto) * (VECES[PRIV.sueldo.frecuencia] || 1);

function grafMeses(serie){

    return `<rect x="${cx - bw - 2}" y="${y(s.i)}" width="${bw}" height="${H - pb - y(s.i)}" rx="4" fill="#b8913f"><title>${nombreMes(s.m)}: entró ${fmtU(s.i)}</title></rect>

  el.querySelectorAll("[data-abono]").forEach(b => b.addEventListener("click", () => { const v = venta(b.dataset.abono); abrirMov(null, { tipo: "ingreso", ventaId: v.id, categoria: AJ.categoriasIngreso[0], descripcion: "Abono " + (v.producto || "") }); }));
}

/* ===== AJUSTES ===== */
async function crearCajasSugeridas(){
  try {
    let i = CUENTAS.length;
    for (const c of CAJAS_SUGERIDAS) { const id = slug(c.nombre); const d = Object.assign({ inicial: 0, activa: true, orden: ++i }, c); await db.collection("cuentas").doc(id).set(d); CUENTAS.push(Object.assign({ id }, d)); }
    toast("Cajas creadas. Ahora escribe cuánto tiene cada una hoy."); tab = "ajustes"; refrescar();
  } catch (e) { console.error(e); toast("No se pudieron crear las cajas. Revisa las reglas de Firestore."); }
}
function pintarAjustes(){
  const el = $("t-ajustes"), s = PRIV.sueldo, tv = AJ.tasa || {};
  el.innerHTML = `<div class="barra"><h2>Cajas y ajustes</h2></div>
    <div class="form" style="padding:0">
      <div class="bloque"><h3>Tasa del dólar</h3>
        <p class="ayuda">Se usa para convertir a dólares lo que entra y sale en bolívares. Cada movimiento guarda la tasa de su día.</p>
        <div class="fila"><label class="f">Bs por $1<input type="text" inputmode="decimal" id="a-tasa" value="${inNum(tv.valor)}"></label><label class="f">Fecha<input type="date" id="a-tasa-f" value="${tv.fecha || hoy()}"></label></div>
        <p style="display:flex;gap:10px;flex-wrap:wrap;margin:0"><button class="btn oro" id="a-tasa-ok">GUARDAR TASA</button><button class="btn borde" id="a-bcv">Buscar tasa BCV de hoy</button></p></div>

      <div class="bloque"><h3>Cajas</h3>
        <p class="ayuda">Cada lugar donde está el dinero del negocio. En <b>Saldo inicial</b> escribe cuánto tenía la caja el día que empezaste a anotar. Tu cuenta personal no va aquí.</p>
        <div class="wrap-t"><table class="t"><thead><tr><th>Nombre</th><th>Moneda</th><th>Saldo inicial</th><th class="num">Saldo hoy</th><th>Activa</th></tr></thead><tbody>
          ${CUENTAS.map(c => `<tr><td style="min-width:180px"><input type="text" data-c="${c.id}" data-k="nombre" value="${esc(c.nombre)}"></td>
            <td><select data-c="${c.id}" data-k="moneda" ${MOVS.some(m => m.cuenta === c.id || m.cuentaDestino === c.id) ? "disabled title='Ya tiene movimientos'" : ""}><option value="VES" ${c.moneda === "VES" ? "selected" : ""}>Bs</option><option value="USD" ${c.moneda === "USD" ? "selected" : ""}>$</option></select></td>
            <td style="min-width:120px"><input type="text" inputmode="decimal" data-c="${c.id}" data-k="inicial" value="${inNum(num(c.inicial))}" placeholder="0,00"></td>
            <td class="num">${fmtM(saldo(c), c.moneda)}</td>
            <td><input type="checkbox" class="chk" data-c="${c.id}" data-k="activa" ${c.activa !== false ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--gold)"></td></tr>`).join("")}
          <tr><td><input type="text" id="a-nc" placeholder="Nueva caja, ej: Banesco"></td><td><select id="a-nm"><option value="VES">Bs</option><option value="USD">$</option></select></td><td colspan="3"><button class="btn borde mini" id="a-add">+ Agregar caja</button>${!CUENTAS.length ? ` <button class="btn oro mini" id="a-sug">Crear las sugeridas</button>` : ""}</td></tr>
        </tbody></table></div>
        <p style="margin:0"><button class="btn oro" id="a-cajas-ok">GUARDAR CAJAS</button></p></div>

      <div class="bloque"><h3>Sueldo del dueño</h3>
        <p class="ayuda">La regla para separar tu dinero: el negocio te paga un sueldo fijo y tú vives de ese sueldo. Lo demás se queda en el negocio para material, imprevistos y crecer. Si necesitas sacar algo extra, anótalo como <b>Retiro personal</b>.</p>
        <div class="fila">
          <label class="f">Monto por pago <small>en dólares</small><input type="text" inputmode="decimal" id="a-s-monto" value="${inNum(num(s.monto))}"></label>
          <label class="f">Cada cuánto<select id="a-s-frec">${["mensual", "quincenal", "semanal"].map(f => `<option ${s.frecuencia === f ? "selected" : ""}>${f}</option>`).join("")}</select></label>
          <label class="f">Caja de donde sale<select id="a-s-cuenta"><option value="">Elegir cada vez</option>${CUENTAS.map(c => `<option value="${c.id}" ${s.cuenta === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}</select></label></div>
        <p style="margin:0"><button class="btn oro" id="a-s-ok">GUARDAR SUELDO</button></p></div>

      <div class="bloque"><h3>Categorías</h3><div class="fila">
        <label class="f">De ingresos <small>una por línea</small><textarea id="a-ci">${esc(AJ.categoriasIngreso.join("\n"))}</textarea></label>
        <label class="f">De gastos <small>una por línea</small><textarea id="a-cg" style="min-height:240px">${esc(AJ.categoriasGasto.join("\n"))}</textarea></label></div>
        <p style="margin:0"><button class="btn oro" id="a-cat-ok">GUARDAR CATEGORÍAS</button></p></div>

      <div class="bloque"><h3>Equipo</h3>
        <p class="ayuda">Personas que pueden <b>anotar gastos e ingresos</b>. Solo ven lo que ellas mismas anotan: no ven saldos, sueldo, resumen ni ventas.</p>
        ${EQUIPO.length ? `<div class="wrap-t"><table class="t"><tbody>${EQUIPO.map(p => `<tr><td><b>${esc(p.nombre || "")}</b><span class="sub">${esc(p.id)}</span></td><td><span class="chip ${p.activo === false ? "est-anulado" : "ingreso"}">${p.activo === false ? "Sin acceso" : "Activo"}</span></td>
          <td style="text-align:right;white-space:nowrap"><button class="btn borde mini" data-eq-t="${esc(p.id)}">${p.activo === false ? "Activar" : "Quitar acceso"}</button> <button class="btn borde mini" data-eq-r="${esc(p.id)}">Reenviar enlace</button></td></tr>`).join("")}</tbody></table></div>` : ""}
        <div class="fila"><label class="f">Nombre<input type="text" id="a-eq-n" placeholder="Ej: María"></label><label class="f">Correo<input type="email" id="a-eq-e" placeholder="correo@gmail.com"></label></div>
        <p style="margin:0"><button class="btn oro" id="a-eq-ok">AGREGAR AL EQUIPO</button></p>
        <p class="ayuda">Le llegará un correo para crear su contraseña. Luego entra en esta misma página: <b>contabilidad.html</b>.</p></div>
    </div>`;
  const on = (id, f) => { const n = $(id); if (n) n.addEventListener("click", f); };
  const conBoton = (id, f) => on(id, async () => { const b = $(id), t = b.textContent; b.disabled = true; b.textContent = "Guardando…"; try { await f(); } catch (e) { console.error(e); toast("No se pudo guardar. Revisa las reglas de Firestore."); } finally { if ($(id)) { $(id).disabled = false; $(id).textContent = t; } } });
  conBoton("a-tasa-ok", async () => { const v = num($("a-tasa").value); if (!(v > 0)) return toast("Escribe la tasa."); AJ.tasa = { valor: v, fecha: $("a-tasa-f").value || hoy() }; await db.collection("contab").doc("publico").set(AJ); toast("Tasa guardada."); pintarTabs(); });
  on("a-bcv", async () => {
    const b = $("a-bcv"); b.disabled = true; b.textContent = "Buscando…";
    try { const r = await fetch("https://ve.dolarapi.com/v1/dolares/oficial"); const j = await r.json(); const v = num(j.promedio);
      if (!(v > 0)) throw 0; $("a-tasa").value = inNum(v); $("a-tasa-f").value = (j.fechaActualizacion || hoy()).slice(0, 10); toast("Tasa BCV encontrada. Revísala y guarda."); }
    catch (e) { toast("No se pudo consultar la tasa. Escríbela a mano."); }
    finally { b.disabled = false; b.textContent = "Buscar tasa BCV de hoy"; }
  });
  el.querySelectorAll("[data-c]").forEach(i => i.addEventListener("change", () => { const c = cuenta(i.dataset.c), k = i.dataset.k; c[k] = k === "activa" ? i.checked : k === "inicial" ? num(i.value) : i.value; c._cambio = true; }));
  on("a-sug", crearCajasSugeridas);
  conBoton("a-add", async () => { const n = $("a-nc").value.trim(); if (!n) return toast("Escribe el nombre de la caja."); const id = slug(n) + (cuenta(slug(n)) ? "-" + Date.now().toString(36).slice(-3) : "");
    const d = { nombre: n, moneda: $("a-nm").value, inicial: 0, activa: true, orden: CUENTAS.length + 1 }; await db.collection("cuentas").doc(id).set(d); CUENTAS.push(Object.assign({ id }, d)); toast("Caja agregada."); pintarAjustes(); });
  conBoton("a-cajas-ok", async () => { for (const c of CUENTAS.filter(c => c._cambio)) { const { id, _cambio, ...d } = c; await db.collection("cuentas").doc(id).set(d); delete c._cambio; } toast("Cajas guardadas."); pintarAjustes(); });
  conBoton("a-s-ok", async () => { PRIV.sueldo = { monto: num($("a-s-monto").value), frecuencia: $("a-s-frec").value, cuenta: $("a-s-cuenta").value }; await db.collection("contab").doc("privado").set(PRIV); toast("Sueldo guardado."); });
  conBoton("a-cat-ok", async () => { const l = id => [...new Set($(id).value.split("\n").map(s => s.trim()).filter(Boolean))];
    const ci = l("a-ci"), cg = l("a-cg"); if (!ci.length || !cg.length) return toast("Deja al menos una categoría de cada tipo."); AJ.categoriasIngreso = ci; AJ.categoriasGasto = cg; await db.collection("contab").doc("publico").set(AJ); toast("Categorías guardadas."); });
  conBoton("a-eq-ok", async () => {
    const em = $("a-eq-e").value.trim().toLowerCase(), n = $("a-eq-n").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Escribe un correo válido.");
    if (em === DUENO) return toast("Ese es tu correo de dueño.");
    let aviso = "";
    try {
      const sec = (firebase.apps || []).find(a => a.name === "equipo") || firebase.initializeApp(FIREBASE_CONFIG, "equipo");
      const clave = Array.from(crypto.getRandomValues(new Uint8Array(18)), b => b.toString(36)).join("");
      try { await sec.auth().createUserWithEmailAndPassword(em, clave); } catch (e) { if (!/email-already-in-use/.test(e.code || "")) throw e; }
      await sec.auth().signOut().catch(() => {});
      await auth.sendPasswordResetEmail(em);
    } catch (e) { console.error(e); aviso = " No se pudo crear su acceso automáticamente: créalo en Firebase → Authentication → Agregar usuario."; }
    const d = { nombre: n, activo: true, desde: hoy() };
    await db.collection("equipo").doc(em).set(d); EQUIPO.push(Object.assign({ id: em }, d));
    toast(aviso ? "Agregado." + aviso : `Listo. Le enviamos a ${em} el enlace para crear su contraseña.`); pintarAjustes();
  });
  el.querySelectorAll("[data-eq-t]").forEach(b => b.addEventListener("click", async () => { const p = EQUIPO.find(z => z.id === b.dataset.eqT); p.activo = p.activo === false;
    try { await db.collection("equipo").doc(p.id).update({ activo: p.activo }); toast(p.activo ? "Acceso activado." : "Acceso quitado."); pintarAjustes(); } catch (e) { toast("No se pudo cambiar."); } }));
  el.querySelectorAll("[data-eq-r]").forEach(b => b.addEventListener("click", async () => { try { await auth.sendPasswordResetEmail(b.dataset.eqR); toast("Enlace reenviado."); } catch (e) { toast("No se pudo enviar."); } }));
}

/* ===== EXCEL ===== */
function cargarScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function exportar(mes, movs){
  const ls = movs || movsOrdenados(MOVS).filter(m => !mes || (m.fecha || "").startsWith(mes));
  const hojaMov = [["Fecha", "Tipo", "Categoría", "Descripción", "Caja", "Moneda", "Monto", "Tasa", "Equivalente $", "Caja destino", "Monto destino", "Venta", "Cliente", "Referencia", "Anotado por"],
    ...ls.map(m => { const v = venta(m.ventaId) || {}; return [m.fecha, (TIPOS[m.tipo] || {}).n || m.tipo, m.categoria, m.descripcion, nomCuenta(m.cuenta), m.moneda === "VES" ? "Bs" : "$", m.monto, m.tasa || "", m.usd,
      m.cuentaDestino ? nomCuenta(m.cuentaDestino) : "", m.montoDestino || "", v.numero || "", v.cliente || "", m.ref, m.creadoPor]; })];
  const hojaVen = [["N°", "Fecha", "Cliente", "Teléfono", "Producto", "Estado", "Total $", "Cobrado $", "Saldo $", "Costos $", "Ganancia $"],
    ...VENTAS.filter(v => !mes || (v.fecha || "").startsWith(mes) || saldoVenta(v) > 0.009).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""))
      .map(v => [v.numero, v.fecha, v.cliente, v.telefono, v.producto, v.estado, num(v.total), cobrado(v), saldoVenta(v), costo(v), num(v.total) - costo(v)])];
  const hojaCaj = [["Caja", "Moneda", "Saldo hoy", "Equivalente $ (tasa " + fmtN((AJ.tasa || {}).valor) + ")"], ...CUENTAS.map(c => [c.nombre, c.moneda === "VES" ? "Bs" : "$", saldo(c), aUSD(saldo(c), c.moneda)])];
  const hojas = [];
  if (mes) { const t = totalesMes(mes);
    hojas.push(["Resumen", [["Muebles Ideal · " + nombreMes(mes)], [], ["Entró (ingresos) $", t.ingreso], ["Gastos del negocio $", t.gasto], ["Utilidad $", t.utilidad], ["Sueldo del dueño $", t.sueldo], ["Retiros personales $", t.retiro], ["Aportes del dueño $", t.aporte], ["Quedó en el negocio $", t.queda], [], ["Gastos por categoría"], ...Object.entries(t.cat).sort((a, b) => b[1] - a[1])]]); }
  hojas.push(["Movimientos", hojaMov], ["Ventas", hojaVen], ["Cajas", hojaCaj]);
  const nombre = "Contabilidad-MueblesIdeal-" + (mes || "todo");
  toast("Preparando Excel…");
  try {
    if (!window.XLSX) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.utils.book_new();
    for (const [n, filas] of hojas) { const ws = XLSX.utils.aoa_to_sheet(filas); ws["!cols"] = filas[0].map((_, i) => ({ wch: Math.min(40, Math.max(10, ...filas.map(f => String(f[i] == null ? "" : f[i]).length + 2))) })); XLSX.utils.book_append_sheet(wb, ws, n); }
    XLSX.writeFile(wb, nombre + ".xlsx"); toast("Excel descargado.");
  } catch (e) {
    console.error(e);
    const csv = "﻿" + hojaMov.map(f => f.map(v => { const s = typeof v === "number" ? String(Math.round(v * 100) / 100).replace(".", ",") : String(v == null ? "" : v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })), a = document.createElement("a");
    a.href = url; a.download = nombre + ".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("Se descargó en formato CSV (se abre con Excel).");
  }
}
